service: roomie-match-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    TABLE_NAME: !Ref ProfilesTable
    PHOTOS_BUCKET: !Ref PhotosBucket
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchWriteItem
            - dynamodb:BatchGetItem
            - dynamodb:ConditionCheckItem
          Resource:
            - !GetAtt ProfilesTable.Arn
            - !Sub "${ProfilesTable.Arn}/index/*"
        # Photos: upload, view, and delete files under photos/
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Sub "${PhotosBucket.Arn}/photos/*"
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - !GetAtt PhotosBucket.Arn
        # Delete account removes the Cognito login too
        - Effect: Allow
          Action:
            - cognito-idp:AdminDeleteUser
          Resource:
            - !GetAtt UserPool.Arn
  httpApi:
    # Which websites are allowed to call this API from a browser.
    # Add the real site's address here once the frontend is hosted (Module 12).
    cors:
      allowedOrigins:
        - http://localhost:5173
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
        audience:
          - !Ref UserPoolClient

functions:
  messages:
    handler: src/handlers/messages.handler
    events:
      - httpApi:
          path: /matches/{userId}/messages
          method: get
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /matches/{userId}/messages
          method: post
          authorizer:
            name: cognitoAuthorizer
  health:
    handler: src/handlers/health.handler
    events:
      - httpApi:
          path: /health
          method: get
  createProfile:
    handler: src/handlers/createProfile.handler
    events:
      - httpApi:
          path: /profiles
          method: post
          authorizer:
            name: cognitoAuthorizer
  getProfile:
    handler: src/handlers/getProfile.handler
    events:
      - httpApi:
          path: /profiles
          method: get
          authorizer:
            name: cognitoAuthorizer          
  updateProfile:
    handler: src/handlers/updateProfile.handler
    events:
      - httpApi:
          path: /profiles
          method: put
          authorizer:
            name: cognitoAuthorizer
  deleteProfile:
    handler: src/handlers/deleteProfile.handler
    events:
      - httpApi:
          path: /profiles
          method: delete
          authorizer:
            name: cognitoAuthorizer
  discover:
    handler: src/handlers/discover.handler
    events:
      - httpApi:
          path: /discover
          method: get
          authorizer:
            name: cognitoAuthorizer
  swipe:
    handler: src/handlers/swipe.handler
    events:
      - httpApi:
          path: /swipes
          method: post
          authorizer:
            name: cognitoAuthorizer
  swipeHistory:
    handler: src/handlers/swipeHistory.handler
    events:
      - httpApi:
          path: /swipes
          method: get
          authorizer:
            name: cognitoAuthorizer
  undoSwipe:
    handler: src/handlers/undoSwipe.handler
    events:
      - httpApi:
          path: /swipes/{userId}
          method: delete
          authorizer:
            name: cognitoAuthorizer
  searchPeople:
    handler: src/handlers/searchPeople.handler
    events:
      - httpApi:
          path: /people
          method: get
          authorizer:
            name: cognitoAuthorizer
  getPerson:
    handler: src/handlers/getPerson.handler
    events:
      - httpApi:
          path: /people/{userId}
          method: get
          authorizer:
            name: cognitoAuthorizer
  getMatches:
    handler: src/handlers/getMatches.handler
    events:
      - httpApi:
          path: /matches
          method: get
          authorizer:
            name: cognitoAuthorizer
  searchSchools:
    handler: src/handlers/searchSchools.handler
    events:
      - httpApi:
          path: /schools
          method: get
  photoUploadUrl:
    handler: src/handlers/photoUploadUrl.handler
    events:
      - httpApi:
          path: /profiles/photo
          method: post
          authorizer:
            name: cognitoAuthorizer
  getMatch:
    handler: src/handlers/getMatch.handler
    events:
      - httpApi:
          path: /matches/{userId}
          method: get
          authorizer:
            name: cognitoAuthorizer
  unmatch:
    handler: src/handlers/unmatch.handler
    events:
      - httpApi:
          path: /matches/{userId}
          method: delete
          authorizer:
            name: cognitoAuthorizer
  deleteAccount:
    handler: src/handlers/deleteAccount.handler
    environment:
      USER_POOL_ID: !Ref UserPool
    events:
      - httpApi:
          path: /account
          method: delete
          authorizer:
            name: cognitoAuthorizer
  forgotPassword:
    handler: src/handlers/forgotPassword.handler
    environment:
      USER_POOL_CLIENT_ID: !Ref UserPoolClient
    events:
      - httpApi:
          path: /password/forgot
          method: post
  resetPassword:
    handler: src/handlers/resetPassword.handler
    environment:
      USER_POOL_CLIENT_ID: !Ref UserPoolClient
    events:
      - httpApi:
          path: /password/reset
          method: post
  signup:
    handler: src/handlers/signup.handler
    environment:
      USER_POOL_CLIENT_ID: !Ref UserPoolClient
    events:
      - httpApi:
          path: /signup
          method: post
  confirmSignup:
    handler: src/handlers/confirmSignup.handler
    environment:
      USER_POOL_CLIENT_ID: !Ref UserPoolClient
    events:
      - httpApi:
          path: /signup/confirm
          method: post
  login:
    handler: src/handlers/login.handler
    environment:
      USER_POOL_CLIENT_ID: !Ref UserPoolClient
    events:
      - httpApi:
          path: /login
          method: post

resources:
  Resources:
    ProfilesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          # Second way of filing the same profiles: by school, so Discover can
          # Query one school instead of Scanning the whole table.
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
    # Private bucket for profile photos. Browsers upload with one-time presigned POSTs
    # and view through links that expire, so nothing here is ever public.
    PhotosBucket:
      Type: AWS::S3::Bucket
      Properties:
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - http://localhost:5173
              AllowedMethods:
                - POST
              AllowedHeaders:
                - "*"
    UserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: roomie-match-users
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true

    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: roomie-match-client
        UserPoolId: !Ref UserPool
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH